<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>رنگو | داستان انگلیسی متناسب با سطح شما</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- نوار بالای سایت -->

    <header class="navbar">

        <div class="logo">
            رنگو
        </div>

        <nav>
            <a href="#">خانه</a>
            <a href="#">داستان‌ها</a>
            <a href="#">درباره ما</a>
        </nav>

    </header>


    <main>

        <!-- معرفی -->

        <section class="hero">

            <p class="badge">
                داستان‌های انگلیسی با هوش مصنوعی
            </p>

            <h1>
                داستانی برای
                <br>
                <span>سطح زبان تو</span>
            </h1>

            <p class="subtitle">
                سطح زبانت را انتخاب کن، موضوع داستانت را بنویس
                و یک داستان انگلیسی مخصوص خودت بساز.
            </p>

        </section>


        <!-- ساخت داستان -->

        <section class="story-box">

            <h2>
                داستانت را بساز ✨
            </h2>


            <!-- سطح زبان -->

            <label>
                سطح زبان انگلیسی
            </label>

            <div class="levels">

                <button class="level" data-level="A1">
                    A1
                </button>

                <button class="level" data-level="A2">
                    A2
                </button>

                <button class="level" data-level="B1">
                    B1
                </button>

                <button class="level" data-level="B2">
                    B2
                </button>

                <button class="level" data-level="C1">
                    C1
                </button>

                <button class="level" data-level="C2">
                    C2
                </button>

            </div>


            <!-- ژانر -->

            <label for="genre">
                ژانر داستان
            </label>

            <select id="genre">

                <option value="Fantasy">
                    فانتزی
                </option>

                <option value="Mystery">
                    معمایی
                </option>

                <option value="Adventure">
                    ماجراجویی
                </option>

                <option value="Horror">
                    ترسناک
                </option>

                <option value="Crime">
                    جنایی
                </option>

                <option value="Drama">
                    درام
                </option>

                <option value="Comedy">
                    کمدی
                </option>

                <option value="Romance">
                    عاشقانه
                </option>

                <option value="Science Fiction">
                    علمی‌تخیلی
                </option>

                <option value="Historical">
                    تاریخی
                </option>

                <option value="Custom">
                    بدون ژانر مشخص
                </option>

            </select>


            <!-- موضوع آزاد -->

            <label for="topic">
                موضوع داستان
            </label>

            <textarea
                id="topic"
                placeholder="مثلاً: پسری که یک روز صبح تبدیل به خرس شد..."
            ></textarea>


            <!-- طول داستان -->

            <label for="length">
                طول داستان
            </label>

            <select id="length">

                <option value="short">
                    کوتاه
                </option>

                <option value="medium">
                    متوسط
                </option>

                <option value="long">
                    طولانی
                </option>

            </select>


            <!-- دکمه ساخت -->

            <button
                id="generateButton"
                class="generate"
            >
                ✨ ساخت داستان
            </button>

        </section>


        <!-- نتیجه داستان -->

        <section
            id="storyResult"
            class="story-result hidden"
        >

            <h2>
                📖 داستان شما
            </h2>

            <div id="storyText"></div>

        </section>

    </main>


    <!-- پایین سایت -->

    <footer>

        <p>
            © 2026 رنگو
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
